<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>옛 서울도시철도공사 페이지 복원 (전체화면)</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        #flash-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="flash-container">
        <object data="subway.swf" type="application/x-shockwave-flash" width="100%" height="100%">
            <param name="movie" value="subway.swf">
            <param name="allowScriptAccess" value="always">
            <p>플래시 콘텐츠를 불러올 수 없습니다. 파일 경로를 확인하세요.</p>
        </object>
    </div>

</body>
</html>
